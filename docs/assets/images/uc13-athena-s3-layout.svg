<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
<defs><style>
.title{font:700 23px Arial;fill:#172554}.label{font:600 17px Arial;fill:#0f172a}.small{font:14px Arial;fill:#334155}.bucket{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.folder{fill:#ffedd5;stroke:#fb923c;stroke-width:1.5}.result{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="360" rx="18" fill="#f8fafc"/><text x="38" y="48" class="title">S3 bucket layout cho Athena Lab</text>
<rect x="55" y="85" width="410" height="230" rx="14" class="bucket"/><text x="82" y="120" class="label">Amazon S3 · &lt;bucket-name&gt;</text>
<rect x="88" y="145" width="344" height="68" rx="10" class="folder"/><text x="110" y="174" class="label">raw/loan_demo/</text><text x="110" y="197" class="small">sample_loans.csv · Source data</text>
<rect x="88" y="230" width="344" height="60" rx="10" class="folder"/><text x="110" y="266" class="label">curated/</text><text x="260" y="266" class="small">Parquet / transformed data</text>
<path d="M465 180 H555" class="arrow"/><rect x="570" y="125" width="175" height="110" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="657" y="165" text-anchor="middle" class="label">Athena</text><text x="657" y="190" text-anchor="middle" class="small">SQL query</text><text x="657" y="211" text-anchor="middle" class="small">reads source</text>
