<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
<defs><style>.title{font:700 23px Arial;fill:#172554}.label{font:600 17px Arial;fill:#0f172a}.small{font:14px Arial;fill:#334155}.step{fill:#fff;stroke:#64748b;stroke-width:2}.done{fill:#ecfdf5;stroke:#059669;stroke-width:2}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="360" rx="18" fill="#f8fafc"/><text x="38" y="48" class="title">Athena — cấu hình lần đầu</text>
<rect x="40" y="100" width="205" height="130" rx="12" class="step"/><text x="142" y="140" text-anchor="middle" class="label">1. Mở Athena</text><text x="142" y="170" text-anchor="middle" class="small">Chọn đúng Region</text><text x="142" y="192" text-anchor="middle" class="small">Query editor</text>
<path d="M245 165 H290" class="arrow"/><rect x="305" y="100" width="205" height="130" rx="12" class="step"/><text x="407" y="140" text-anchor="middle" class="label">2. Workgroup</text><text x="407" y="170" text-anchor="middle" class="small">uc13-learning</text><text x="407" y="192" text-anchor="middle" class="small">Encryption / limits</text>
<path d="M510 165 H555" class="arrow"/><rect x="570" y="100" width="205" height="130" rx="12" class="step"/><text x="672" y="140" text-anchor="middle" class="label">3. Output location</text><text x="672" y="170" text-anchor="middle" class="small">s3://bucket/</text><text x="672" y="192" text-anchor="middle" class="small">athena-results/</text>
<path d="M775 165 H820" class="arrow"/><rect x="835" y="100" width="125" height="130" rx="12" class="done"/><text x="897" y="140" text-anchor="middle" class="label">4. Run</text><text x="897" y="170" text-anchor="middle" class="small">SQL</text><text x="897" y="192" text-anchor="middle" class="small">Query</text>
<text x="40" y="285" class="small">Sau khi cấu hình, Athena ghi kết quả mỗi query vào S3 output prefix được chỉ định.</text><text x="40" y="311" class="small">Tách result prefix khỏi raw data; không dùng chung prefix làm nguồn và đích.</text></svg>